plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
group='com.cutieworld'
version='1.0.0'
base { archivesName='cutieworld' }
java.toolchain.languageVersion=JavaLanguageVersion.of(17)

minecraft {
    mappings channel:'official', version:'1.20.1'
    copyIdeResources=true
    runs {
        client { workingDirectory project.file('run'); mods { cutieworld { source sourceSets.main } } }
        server { workingDirectory project.file('run'); mods { cutieworld { source sourceSets.main } } }
    }
}
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.3.22' }
tasks.named('jar',Jar).configure { finalizedBy 'reobfJar' }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
