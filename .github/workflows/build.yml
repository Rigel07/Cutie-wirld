name: Build CutieWorld

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Buscar ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No se encontró ningún ZIP."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Descomprimir ZIP
        run: |
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Buscar proyecto
        run: |
          BUILD_FILE=$(find extracted -name "build.gradle" -type f | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "No se encontró build.gradle."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Compilar mod
        run: |
          cd "$PROJECT_DIR"
          gradle build --no-daemon

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: CutieWorld-Forge-1.20.1
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
